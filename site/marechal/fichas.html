<dialog class="evidence-dialog" id="evidenceDialog" aria-labelledby="evidenceTitle">
  <div class="evidence-top">
    <p class="evidence-kicker">Ficha do indicador</p>
    <button class="btn" type="button" id="closeEvidence">Fechar</button>
  </div>
  <h2 id="evidenceTitle"></h2>
  <p id="evidenceValue" class="evidence-value"></p>
  <dl class="evidence-facts" id="evidenceFacts"></dl>
  <h3>Como interpretar</h3>
  <p id="evidenceNote"></p>
  <div class="evidence-source">
    <h3>Referência</h3>
    <p id="evidenceSource"></p>
    <div class="toolbar">
      <a class="btn strong" id="evidenceOriginal" target="_blank" rel="noopener noreferrer">Abrir fonte original ↗</a>
      <button type="button" class="btn" id="copyEvidence">Copiar link da ficha</button>
    </div>
    <p id="evidenceFeedback" role="status"></p>
  </div>
</dialog>
