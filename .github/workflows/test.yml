name: Verificar e publicar AuditorES

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node --check auditor/workspace.js
      - run: node --check assets/atlas.mjs
      - run: node --check assets/home.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - run: npm run test:browser

  package:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Montar pacote público
        run: bash scripts/build-pages.sh _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
